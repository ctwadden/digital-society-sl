<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="t d"><title id="t">MFA and administrator privilege</title><desc id="d">A causal chain showing where MFA affects privileged remote access and what it does not prove.</desc><rect width="1200" height="800" fill="#0e171c"/><text x="60" y="90" fill="#74e0c1" font-family="Arial" font-size="31" font-weight="700">WHERE A SAFEGUARD ACTS</text><g font-family="Arial" text-anchor="middle"><rect x="60" y="250" width="250" height="150" rx="22" fill="#17313a" stroke="#74e0c1"/><text x="185" y="320" fill="#fff" font-size="26">REMOTE</text><text x="185" y="355" fill="#fff" font-size="26">ACCESS</text><rect x="365" y="250" width="250" height="150" rx="22" fill="#3b3020" stroke="#ffcf5a" stroke-width="5"/><text x="490" y="312" fill="#ffcf5a" font-size="27" font-weight="700">MFA</text><text x="490" y="355" fill="#fff" font-size="22">additional proof</text><rect x="670" y="250" width="250" height="150" rx="22" fill="#17313a" stroke="#74e0c1"/><text x="795" y="320" fill="#fff" font-size="26">ADMIN</text><text x="795" y="355" fill="#fff" font-size="26">PRIVILEGE</text><rect x="975" y="250" width="170" height="150" rx="22" fill="#17313a" stroke="#74e0c1"/><text x="1060" y="340" fill="#fff" font-size="23">SYSTEM</text></g><g stroke="#ffcf5a" stroke-width="10"><path d="M310 325h55M615 325h55M920 325h55"/></g><rect x="120" y="525" width="960" height="150" rx="22" fill="#282021" stroke="#ff8b82"/><text x="600" y="585" text-anchor="middle" fill="#ff8b82" font-family="Arial" font-size="28" font-weight="700">CAUTION</text><text x="600" y="632" text-anchor="middle" fill="#fff" font-family="Arial" font-size="25">Missing MFA can increase exposure; it does not explain every stage alone.</text></svg>
