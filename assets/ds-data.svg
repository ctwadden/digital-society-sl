<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="t d"><title id="t">Reported data removal</title><desc id="d">A data scale visualization connecting 600 gigabytes to analytical questions.</desc><rect width="1200" height="800" fill="#10171d"/><text x="70" y="100" fill="#74e0c1" font-family="Arial" font-size="30" font-weight="700">REPORTED DATA REMOVAL</text><text x="70" y="330" fill="#ffcf5a" font-family="Arial" font-size="190" font-weight="800">≈600 GB</text><text x="75" y="390" fill="#dbe6eb" font-family="Arial" font-size="28">British Library incident review</text><g font-family="Arial"><rect x="70" y="500" width="320" height="170" rx="20" fill="#18303a"/><text x="100" y="555" fill="#74e0c1" font-size="25" font-weight="700">WHAT DATA?</text><text x="100" y="610" fill="#fff" font-size="23">Category affects harm.</text><rect x="440" y="500" width="320" height="170" rx="20" fill="#18303a"/><text x="470" y="555" fill="#74e0c1" font-size="25" font-weight="700">WHO IS AFFECTED?</text><text x="470" y="610" fill="#fff" font-size="23">Stakeholder matters.</text><rect x="810" y="500" width="320" height="170" rx="20" fill="#18303a"/><text x="840" y="555" fill="#74e0c1" font-size="25" font-weight="700">WHAT CAN IT PROVE?</text><text x="840" y="610" fill="#fff" font-size="23">Quantity is not impact.</text></g></svg>
