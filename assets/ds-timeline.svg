<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="t d"><title id="t">British Library incident and recovery timeline</title><desc id="d">Evidence timeline separating reported events from an unknown connection.</desc><rect width="1200" height="800" fill="#0e171c"/><text x="70" y="90" fill="#74e0c1" font-family="Arial" font-size="32" font-weight="700">SUPPORTED TIMELINE</text><path d="M130 390H1070" stroke="#74e0c1" stroke-width="10"/><g font-family="Arial" text-anchor="middle"><circle cx="180" cy="390" r="28" fill="#ffcf5a"/><text x="180" y="300" fill="#fff" font-size="28">Reconnaissance</text><text x="180" y="335" fill="#aebbc2" font-size="20">reported as suspected</text><circle cx="500" cy="390" r="28" fill="#ffcf5a"/><text x="500" y="285" fill="#fff" font-size="28">28 Oct 2023</text><text x="500" y="320" fill="#aebbc2" font-size="20">major ransomware attack</text><circle cx="820" cy="390" r="28" fill="#ffcf5a"/><text x="820" y="285" fill="#fff" font-size="28">Services disrupted</text><text x="820" y="320" fill="#aebbc2" font-size="20">systems damaged</text><circle cx="1040" cy="390" r="28" fill="#ffcf5a"/><text x="1040" y="500" fill="#fff" font-size="28">Recovery</text><text x="1040" y="535" fill="#aebbc2" font-size="20">staged and incomplete</text></g><rect x="300" y="560" width="600" height="130" rx="20" fill="#16262f" stroke="#ffcf5a"/><text x="600" y="615" text-anchor="middle" fill="#ffcf5a" font-family="Arial" font-size="26" font-weight="700">ANALYTIC RULE</text><text x="600" y="660" text-anchor="middle" fill="#fff" font-family="Arial" font-size="24">Mark public-evidence gaps. Do not invent arrows.</text></svg>
