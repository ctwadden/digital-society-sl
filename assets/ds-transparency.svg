<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="t d"><title id="t">Transparency as institutional response</title><desc id="d">A balance comparing collective learning, accountability, trust repair and security limits.</desc><rect width="1200" height="800" fill="#0e171c"/><text x="600" y="90" text-anchor="middle" fill="#74e0c1" font-family="Arial" font-size="31" font-weight="700">TRANSPARENCY IS A TRADE-OFF</text><path d="M600 210v350M340 560h520M420 210h360" stroke="#ffcf5a" stroke-width="12"/><path d="M420 210L230 470M420 210L610 470M780 210L590 470M780 210L970 470" stroke="#74e0c1" stroke-width="7"/><path d="M170 470h500q-60 150-250 150T170 470M530 470h500q-60 150-250 150T530 470" fill="#17313a" stroke="#74e0c1" stroke-width="5"/><g font-family="Arial" text-anchor="middle"><text x="420" y="520" fill="#fff" font-size="25">COLLECTIVE LEARNING</text><text x="420" y="560" fill="#c1d0d5" font-size="21">accountability · resilience</text><text x="780" y="520" fill="#fff" font-size="25">DISCLOSURE LIMITS</text><text x="780" y="560" fill="#c1d0d5" font-size="21">security · uncertainty</text><text x="600" y="720" fill="#ffcf5a" font-size="26">Judge what is gained, what is exposed, for whom and when.</text></g></svg>
