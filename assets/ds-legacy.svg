<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="t d"><title id="t">Legacy system coupling and recovery</title><desc id="d">A relationship model showing tightly connected legacy services and staged recovery.</desc><rect width="1200" height="800" fill="#0e171c"/><text x="60" y="90" fill="#74e0c1" font-family="Arial" font-size="31" font-weight="700">LEGACY COUPLING → RECOVERY COMPLEXITY</text><g stroke="#ffcf5a" stroke-width="8"><path d="M250 260L600 220L950 280M250 260L430 520L790 520L950 280M600 220L430 520M600 220L790 520"/></g><g font-family="Arial" text-anchor="middle"><g fill="#17313a" stroke="#74e0c1" stroke-width="4"><rect x="110" y="190" width="280" height="130" rx="18"/><rect x="460" y="150" width="280" height="130" rx="18"/><rect x="810" y="210" width="280" height="130" rx="18"/><rect x="290" y="470" width="280" height="130" rx="18"/><rect x="650" y="470" width="280" height="130" rx="18"/></g><text x="250" y="265" fill="#fff" font-size="26">CATALOGUE</text><text x="600" y="225" fill="#fff" font-size="26">IDENTITY</text><text x="950" y="285" fill="#fff" font-size="26">REQUESTS</text><text x="430" y="545" fill="#fff" font-size="26">STAFF WORKFLOW</text><text x="790" y="545" fill="#fff" font-size="26">PUBLIC ACCESS</text></g><rect x="300" y="670" width="600" height="70" rx="16" fill="#2b2020"/><text x="600" y="715" text-anchor="middle" fill="#ffcf5a" font-family="Arial" font-size="25">Relationship model—not a prediction of real recovery time</text></svg>
