<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="t d"><title id="t">Collections safe while services unavailable</title><desc id="d">A split comparison between collection integrity and service availability.</desc><rect width="1200" height="800" fill="#0e171c"/><text x="600" y="90" text-anchor="middle" fill="#74e0c1" font-family="Arial" font-size="32" font-weight="700">TWO SYSTEM PROPERTIES</text><rect x="80" y="160" width="480" height="470" rx="28" fill="#163329" stroke="#74e0c1" stroke-width="4"/><text x="320" y="255" text-anchor="middle" fill="#74e0c1" font-family="Arial" font-size="42" font-weight="700">INTEGRITY</text><text x="320" y="355" text-anchor="middle" fill="#fff" font-family="Arial" font-size="34">Collections remained safe</text><text x="320" y="430" text-anchor="middle" fill="#bed0c8" font-family="Arial" font-size="25">The material still exists.</text><circle cx="320" cy="525" r="48" fill="#74e0c1"/><path d="M295 525l18 18 36-42" fill="none" stroke="#0e171c" stroke-width="14"/><rect x="640" y="160" width="480" height="470" rx="28" fill="#3a2024" stroke="#ff8b82" stroke-width="4"/><text x="880" y="255" text-anchor="middle" fill="#ff8b82" font-family="Arial" font-size="42" font-weight="700">AVAILABILITY</text><text x="880" y="340" text-anchor="middle" fill="#fff" font-family="Arial" font-size="31">Discovery and request</text><text x="880" y="380" text-anchor="middle" fill="#fff" font-family="Arial" font-size="31">systems were disrupted</text><text x="880" y="455" text-anchor="middle" fill="#ddc2c3" font-family="Arial" font-size="25">Users cannot perform the function.</text><path d="M845 500l70 70m0-70l-70 70" stroke="#ff8b82" stroke-width="16"/><text x="600" y="720" text-anchor="middle" fill="#ffcf5a" font-family="Arial" font-size="28">Safe data does not automatically mean usable services.</text></svg>
