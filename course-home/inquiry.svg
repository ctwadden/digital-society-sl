<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 360" role="img" aria-labelledby="title desc"><title id="title">From a digital system to a defensible judgment</title><desc id="desc">Trace how the system works, examine evidence and perspectives, then test a judgment against a changed condition.</desc><rect x="1" y="1" width="428" height="358" rx="14" fill="#edf0e7" stroke="#d5ded9"/><g font-family="system-ui,sans-serif" fill="#152e36"><text x="30" y="38" font-size="11" letter-spacing="2">OPERATION GET A 7</text><path d="M56 89v180" stroke="#176c59" stroke-width="2"/><g fill="#176c59"><circle cx="56" cy="91" r="17"/><circle cx="56" cy="175" r="17"/><circle cx="56" cy="260" r="17"/></g><g fill="white" text-anchor="middle" font-size="13"><text x="56" y="96">1</text><text x="56" y="180">2</text><text x="56" y="265">3</text></g><g font-size="19" font-weight="650"><text x="91" y="87">Trace the system.</text><text x="91" y="171">Question the evidence.</text><text x="91" y="256">Defend a judgment.</text></g><g font-size="13" fill="#52676c"><text x="91" y="112">Explain how and why it works.</text><text x="91" y="196">Compare claims, limits and perspectives.</text><text x="91" y="281">What would change your conclusion?</text></g><path d="M30 310h370" stroke="#d5ded9"/><text x="30" y="338" font-size="12" fill="#52676c">Practise · Get feedback · Try a new context</text></g></svg>
