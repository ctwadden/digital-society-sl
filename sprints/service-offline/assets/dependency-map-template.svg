<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img" aria-label="Dependency map template: people on the left, services in the middle, computers and networks on the right, with a boundary line separating what the organization controls from what other organizations provide."><title>Dependency map template: people on the left, services in the middle, computers and networks on the right, with a boundary line separating what the organization controls from what other organizations provide.</title><rect width="960" height="400" fill="#eef3ed"/><style>text{font-family:Arial,sans-serif;fill:#163443}.l{font-size:17px;font-weight:700}.t{font-size:14px}.s{font-size:13px}.box{fill:#fffcf5;stroke:#397570;stroke-width:2}.org{fill:none;stroke:#b55416;stroke-width:2;stroke-dasharray:6 5}.a{stroke:#397570;stroke-width:2.5;fill:none;marker-end:url(#h)}</style><defs><marker id="h" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#397570"/></marker></defs><text class="l" x="20" y="30">Dependency map template · draw arrows from each service to what it needs</text><rect class="box" x="20" y="60" width="200" height="300" rx="7"/><text class="l" x="30" y="83">PEOPLE</text><text class="t" x="30" y="104">[who uses it]</text><rect class="box" x="260" y="60" width="260" height="300" rx="7"/><text class="l" x="270" y="83">SERVICES</text><text class="t" x="270" y="104">[catalogue, website …]</text><rect class="box" x="560" y="60" width="180" height="140" rx="7"/><text class="l" x="570" y="83">INSIDE</text><text class="t" x="570" y="104">[servers, network,</text><text class="t" x="570" y="122">identity]</text><rect class="box" x="560" y="220" width="180" height="140" rx="7"/><text class="l" x="570" y="243">OUTSIDE</text><text class="t" x="570" y="264">[ISP, cloud,</text><text class="t" x="570" y="282">messaging]</text><rect class="box" x="780" y="60" width="160" height="300" rx="7"/><text class="l" x="790" y="83">EVIDENCE</text><text class="t" x="790" y="104">[source + location</text><text class="t" x="790" y="122">or “?”]</text><line x1="545" y1="210" x2="755" y2="210" stroke="#b55416" stroke-width="3" stroke-dasharray="8 6"/><text class="s" x="560" y="385">Dashed line = system boundary (what the organization controls)</text></svg>