<svg xmlns="http://www.w3.org/2000/svg" width="960" height="350" viewBox="0 0 960 350" role="img" aria-label="Request and response: the browser asks the DNS resolver for the address of the catalogue name; the resolver answers 198.51.100.20; the browser sends an HTTP request across routers to the server; the server replies with a status code and the page."><title>Request and response: the browser asks the DNS resolver for the address of the catalogue name; the resolver answers 198.51.100.20; the browser sends an HTTP request across routers to the server; the server replies with a status code and the page.</title><rect width="960" height="350" fill="#eef3ed"/><style>text{font-family:Arial,sans-serif;fill:#163443}.l{font-size:17px;font-weight:700}.t{font-size:14px}.s{font-size:13px}.box{fill:#fffcf5;stroke:#397570;stroke-width:2}.org{fill:none;stroke:#b55416;stroke-width:2;stroke-dasharray:6 5}.a{stroke:#397570;stroke-width:2.5;fill:none;marker-end:url(#h)}</style><defs><marker id="h" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#397570"/></marker></defs><text class="l" x="20" y="30">One web request · names → address → route → HTTP</text><rect class="box" x="20" y="70" width="170" height="80" rx="7"/><text class="l" x="30" y="93">1 BROWSER</text><text class="t" x="30" y="114">types the URL</text><rect class="box" x="260" y="70" width="190" height="80" rx="7"/><text class="l" x="270" y="93">2 DNS RESOLVER</text><text class="t" x="270" y="114">name → 198.51.100.20</text><rect class="box" x="520" y="70" width="190" height="80" rx="7"/><text class="l" x="530" y="93">3 ROUTERS</text><text class="t" x="530" y="114">follow routing cards</text><rect class="box" x="780" y="70" width="160" height="80" rx="7"/><text class="l" x="790" y="93">4 SERVER</text><text class="t" x="790" y="114">HTTP request</text><rect class="box" x="520" y="210" width="420" height="80" rx="7"/><text class="l" x="530" y="233">5 RESPONSE</text><text class="t" x="530" y="254">status 200 OK + page, or 404 / 503 error</text><path class="a" d="M190 110H252"/><path class="a" d="M450 110H512"/><path class="a" d="M710 110H772"/><path class="a" d="M860 150V202"/><path class="a" d="M520 250H105V158"/><text class="s" x="20" y="330">Each step uses an agreed standard (protocol), which is why devices from different makers work together.</text></svg>