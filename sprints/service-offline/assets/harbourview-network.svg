<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-label="Harbourview network: laptop L to switch S1 to library router R1 to NorthNet router R2, then through exchange router R3 or backup R6 to CloudDock router R4 and catalogue server W. DNS resolver D is attached to NorthNet."><title>Harbourview network: laptop L to switch S1 to library router R1 to NorthNet router R2, then through exchange router R3 or backup R6 to CloudDock router R4 and catalogue server W. DNS resolver D is attached to NorthNet.</title><rect width="960" height="420" fill="#eef3ed"/><style>text{font-family:Arial,sans-serif;fill:#163443}.l{font-size:17px;font-weight:700}.t{font-size:14px}.s{font-size:13px}.box{fill:#fffcf5;stroke:#397570;stroke-width:2}.org{fill:none;stroke:#b55416;stroke-width:2;stroke-dasharray:6 5}.a{stroke:#397570;stroke-width:2.5;fill:none;marker-end:url(#h)}</style><defs><marker id="h" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#397570"/></marker></defs><text class="l" x="20" y="30">Harbourview network · synthetic teaching model · dashed boxes = organizations</text><rect class="org" x="12" y="50" width="300" height="130"/><text class="s" x="20" y="68">Harbourview Public Library</text><rect class="org" x="330" y="50" width="150" height="330"/><text class="s" x="338" y="68">NorthNet ISP</text><rect class="org" x="498" y="50" width="150" height="330"/><text class="s" x="506" y="68">Internet exchange</text><rect class="org" x="666" y="50" width="282" height="130"/><text class="s" x="674" y="68">CloudDock (another country)</text><rect class="box" x="20" y="85" width="80" height="80" rx="7"/><text class="l" x="30" y="108">L</text><text class="t" x="30" y="129">laptop</text><text class="t" x="30" y="147">10.20.0.15</text><rect class="box" x="120" y="85" width="70" height="80" rx="7"/><text class="l" x="130" y="108">S1</text><text class="t" x="130" y="129">switch</text><rect class="box" x="210" y="85" width="90" height="80" rx="7"/><text class="l" x="220" y="108">R1</text><text class="t" x="220" y="129">library</text><text class="t" x="220" y="147">router</text><rect class="box" x="345" y="85" width="120" height="80" rx="7"/><text class="l" x="355" y="108">R2</text><text class="t" x="355" y="129">ISP router</text><rect class="box" x="345" y="270" width="120" height="90" rx="7"/><text class="l" x="355" y="293">D</text><text class="t" x="355" y="314">DNS resolver</text><text class="t" x="355" y="332">192.0.2.53</text><rect class="box" x="513" y="85" width="120" height="80" rx="7"/><text class="l" x="523" y="108">R3</text><text class="t" x="523" y="129">exchange A</text><rect class="box" x="513" y="200" width="120" height="80" rx="7"/><text class="l" x="523" y="223">R6</text><text class="t" x="523" y="244">exchange B</text><text class="t" x="523" y="262">(backup link)</text><rect class="box" x="680" y="85" width="110" height="80" rx="7"/><text class="l" x="690" y="108">R4</text><text class="t" x="690" y="129">CloudDock</text><text class="t" x="690" y="147">router</text><rect class="box" x="810" y="85" width="128" height="80" rx="7"/><text class="l" x="820" y="108">W</text><text class="t" x="820" y="129">catalogue</text><text class="t" x="820" y="147">198.51.100.20</text><path class="a" d="M100 125H112"/><path class="a" d="M190 125H202"/><path class="a" d="M300 125H337"/><path class="a" d="M465 125H505"/><path class="a" d="M633 125H672"/><path class="a" d="M790 125H802"/><path class="a" d="M405 165V262"/><path class="a" d="M465 150L505 225"/><path class="a" d="M633 240L690 170"/><text class="s" x="20" y="404">Addresses are reserved documentation/private ranges; the domain ends in .example. Links carry at most 2 packets per round unless a scenario changes it.</text></svg>