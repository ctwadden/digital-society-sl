<svg xmlns="http://www.w3.org/2000/svg" width="960" height="320" viewBox="0 0 960 320" role="img" aria-label="Computer model: input devices feed the CPU; the CPU works with RAM; the operating system manages hardware, memory and applications; storage keeps files when the power is off; output devices show results; a network interface connects to other computers."><title>Computer model: input devices feed the CPU; the CPU works with RAM; the operating system manages hardware, memory and applications; storage keeps files when the power is off; output devices show results; a network interface connects to other computers.</title><rect width="960" height="320" fill="#eef3ed"/><style>text{font-family:Arial,sans-serif;fill:#163443}.l{font-size:17px;font-weight:700}.t{font-size:14px}.s{font-size:13px}.box{fill:#fffcf5;stroke:#397570;stroke-width:2}.org{fill:none;stroke:#b55416;stroke-width:2;stroke-dasharray:6 5}.a{stroke:#397570;stroke-width:2.5;fill:none;marker-end:url(#h)}</style><defs><marker id="h" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#397570"/></marker></defs><text class="l" x="20" y="30">Inside the computer · what each part does in a catalogue search</text><rect class="box" x="20" y="60" width="170" height="70" rx="7"/><text class="l" x="30" y="83">INPUT</text><text class="t" x="30" y="104">keyboard, touch</text><rect class="box" x="260" y="60" width="200" height="70" rx="7"/><text class="l" x="270" y="83">CPU</text><text class="t" x="270" y="104">executes instructions</text><rect class="box" x="530" y="60" width="190" height="70" rx="7"/><text class="l" x="540" y="83">RAM (volatile)</text><text class="t" x="540" y="104">data being processed</text><rect class="box" x="260" y="180" width="200" height="80" rx="7"/><text class="l" x="270" y="203">OPERATING SYSTEM</text><text class="t" x="270" y="224">manages hardware,</text><text class="t" x="270" y="242">memory, applications</text><rect class="box" x="530" y="180" width="190" height="80" rx="7"/><text class="l" x="540" y="203">APPLICATION</text><text class="t" x="540" y="224">catalogue app</text><rect class="box" x="20" y="180" width="170" height="80" rx="7"/><text class="l" x="30" y="203">STORAGE</text><text class="t" x="30" y="224">SSD/HDD, keeps files</text><text class="t" x="30" y="242">when power is off</text><rect class="box" x="770" y="60" width="170" height="70" rx="7"/><text class="l" x="780" y="83">OUTPUT</text><text class="t" x="780" y="104">screen</text><rect class="box" x="770" y="180" width="170" height="80" rx="7"/><text class="l" x="780" y="203">NETWORK</text><text class="t" x="780" y="224">interface card →</text><text class="t" x="780" y="242">switch/router</text><path class="a" d="M190 95H252"/><path class="a" d="M460 95H522"/><path class="a" d="M720 95H762"/><path class="a" d="M360 130V172"/><path class="a" d="M460 220H522"/><path class="a" d="M190 220H252"/><path class="a" d="M720 220H762"/><text class="s" x="20" y="300">Malware is also software: it runs with the permissions it can obtain, which is why it can encrypt or copy files.</text></svg>