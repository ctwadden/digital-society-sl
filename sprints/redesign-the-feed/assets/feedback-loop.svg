<svg xmlns="http://www.w3.org/2000/svg" width="960" height="380" viewBox="0 0 960 380" role="img" aria-label="Feedback loop in a recommender: ranking decides exposure, exposure produces interactions, interactions become data, data changes the next ranking. Items not shown produce no new data."><title>Feedback loop in a recommender: ranking decides exposure, exposure produces interactions, interactions become data, data changes the next ranking. Items not shown produce no new data.</title><rect width="960" height="380" fill="#eef3ed"/><style>text{font-family:Arial,sans-serif;fill:#163443}.l{font-size:20px;font-weight:700}.t{font-size:17px}.s{font-size:14px}.box{fill:#fffcf5;stroke:#397570;stroke-width:2}.warn{fill:#f6ebd5;stroke:#b55416;stroke-width:2}.a{stroke:#397570;stroke-width:3;fill:none;marker-end:url(#h)}.d{stroke:#b55416;stroke-width:3;fill:none;stroke-dasharray:8 6;marker-end:url(#h2)}</style><defs><marker id="h" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#397570"/></marker><marker id="h2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#b55416"/></marker></defs><text class="l" x="24" y="34">Loopline feedback loop · synthetic teaching model</text><rect class="box" x="40" y="70" width="230" height="90" rx="8"/><text class="l" x="52" y="98">1 · RANK</text><text class="t" x="52" y="122">score = a·c + b·m + d·f + e·n</text><rect class="box" x="360" y="70" width="230" height="90" rx="8"/><text class="l" x="372" y="98">2 · EXPOSE</text><text class="t" x="372" y="122">top three shown widely</text><rect class="box" x="680" y="70" width="240" height="90" rx="8"/><text class="l" x="692" y="98">3 · INTERACT</text><text class="t" x="692" y="122">views, watch time</text><rect class="box" x="360" y="230" width="230" height="90" rx="8"/><text class="l" x="372" y="258">4 · DATA</text><text class="t" x="372" y="282">+0.5 bonus next day</text><rect class="warn" x="680" y="230" width="240" height="110" rx="8"/><text class="l" x="692" y="258">NOT SHOWN</text><text class="t" x="692" y="282">no interactions</text><text class="t" x="692" y="303">no new data</text><text class="t" x="692" y="324">estimate never changes</text><path class="a" d="M270 115H352"/><path class="a" d="M590 115H672"/><path class="a" d="M800 160V190H475V222"/><path class="a" d="M360 275H155V168"/><path class="d" d="M590 300H672"/><text class="s" x="24" y="366">Model of a mechanism under stated rules. Not evidence of how any real platform behaves.</text></svg>