<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">What is being exchanged?</title><desc id="desc">Crowdsourcing seeks ideas or work; crowdfunding seeks money; microwork and gigs involve paid tasks or services; sharing involves access to assets or services.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#176d66"/></marker></defs><rect width="1200" height="680" rx="20" fill="#f0f6f2"/><g font-family="Arial,sans-serif" fill="#15313c"><text x="44" y="66" font-size="38" font-weight="700">What is being exchanged?</text><text x="44" y="104" font-size="21">4.2B · pp. 217–219 · relationships may overlap.</text><rect x="44" y="145" width="540" height="205" rx="14" fill="#ffffff" stroke="#7caaa0" stroke-width="2"/><text x="64" y="183" font-size="30" font-weight="700">CROWDSOURCING</text><text x="64" y="218" font-size="28">Ideas or work from a crowd</text><text x="64" y="247" font-size="24">Need review, quality and representation</text><rect x="611" y="145" width="540" height="205" rx="14" fill="#ffffff" stroke="#7caaa0" stroke-width="2"/><text x="631" y="183" font-size="30" font-weight="700">CROWDFUNDING</text><text x="631" y="218" font-size="28">Money supporting a project</text><text x="631" y="247" font-size="24">Different purpose from collecting ideas</text><rect x="44" y="379" width="540" height="205" rx="14" fill="#ffffff" stroke="#7caaa0" stroke-width="2"/><text x="64" y="417" font-size="30" font-weight="700">MICROWORK / GIGS</text><text x="64" y="452" font-size="27">Small paid tasks / matched services</text><text x="64" y="481" font-size="27">Ask who controls terms and remedies</text><rect x="611" y="379" width="540" height="205" rx="14" fill="#ffffff" stroke="#7caaa0" stroke-width="2"/><text x="631" y="417" font-size="30" font-weight="700">SHARING</text><text x="631" y="452" font-size="28">Access to an asset or service</text><text x="631" y="481" font-size="27">May overlap with platform-paid work</text><text x="44" y="643" font-size="17">Original teaching schematic · Crowdsourcing seeks ideas or work; crowdfunding seeks money; microwork and gigs involve paid tasks or ser</text></g></svg>