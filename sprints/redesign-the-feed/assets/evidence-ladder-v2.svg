<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">Do not skip the evidence between claims</title><desc id="desc">Observation can support a pattern; a mechanism explanation needs a rule; claims of intent need evidence of objectives and decisions. An implication needs a supported impact and stated conditions.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#176d66"/></marker></defs><rect width="1200" height="680" rx="20" fill="#f0f6f2"/><g font-family="Arial,sans-serif" fill="#15313c"><text x="44" y="66" font-size="38" font-weight="700">Do not skip the evidence between claims</text><text x="44" y="104" font-size="21">A recorded pattern does not reveal a designer’s intention.</text><rect x="44" y="150" width="335" height="170" rx="14" fill="#ffffff" stroke="#7caaa0" stroke-width="2"/><text x="64" y="188" font-size="30" font-weight="700">OBSERVATION</text><text x="64" y="223" font-size="23">What did the log record?</text><text x="64" y="252" font-size="22">Exposure and interactions</text><text x="64" y="281" font-size="28">Who was absent?</text><path d="M390,230 L424,230" fill="none" stroke="#176d66" stroke-width="4" marker-end="url(#arrow)"/><rect x="437" y="150" width="335" height="170" rx="14" fill="#ffffff" stroke="#7caaa0" stroke-width="2"/><text x="457" y="188" font-size="30" font-weight="700">MECHANISM</text><text x="457" y="223" font-size="20">How might a rule explain it?</text><text x="457" y="252" font-size="20">Identify a changed operation</text><text x="457" y="281" font-size="18">Test an alternative explanation</text><path d="M783,230 L815,230" fill="none" stroke="#176d66" stroke-width="4" marker-end="url(#arrow)"/><rect x="828" y="150" width="326" height="170" rx="14" fill="#ffffff" stroke="#7caaa0" stroke-width="2"/><text x="848" y="188" font-size="30" font-weight="700">INTENT / IMPACT</text><text x="848" y="223" font-size="19">Intent: objective documents?</text><text x="848" y="252" font-size="18">Impact: suitable outcome data?</text><text x="848" y="281" font-size="17">A model cannot establish either</text><rect x="44" y="364" width="1110" height="193" rx="14" fill="#ffffff" stroke="#7caaa0" stroke-width="2"/><text x="64" y="402" font-size="30" font-weight="700">Impact → implication</text><text x="64" y="437" font-size="25">Immediate consequence for a named group → why it matters under stated conditions.</text><text x="64" y="466" font-size="28">Example: more chances to see an exhibit → possibly wider cultural access.</text><text x="64" y="495" font-size="28">Missing evidence: attendance, sustained access, audience and income.</text><text x="44" y="643" font-size="17">Original teaching schematic · Observation can support a pattern; a mechanism explanation needs a rule; claims of intent need evidence o</text></g></svg>