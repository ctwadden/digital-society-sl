<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">Digital business is a system of operations</title><desc id="desc">Digital business includes transactions, inventory, communication and analytics. Workforce diversity differs from horizontal, vertical, concentric and conglomerate diversification; examples are conceptual.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#176d66"/></marker></defs><rect width="1200" height="680" rx="20" fill="#f0f6f2"/><g font-family="Arial,sans-serif" fill="#15313c"><text x="44" y="66" font-size="38" font-weight="700">Digital business is a system of operations</text><text x="44" y="104" font-size="21">4.2A · pp. 213–217 · classify the changed relationship, not the brand.</text><rect x="44" y="150" width="355" height="180" rx="14" fill="#ffffff" stroke="#7caaa0" stroke-width="2"/><text x="64" y="188" font-size="30" font-weight="700">OPERATIONS</text><text x="64" y="223" font-size="23">Transactions and inventory</text><text x="64" y="252" font-size="22">Communication and analytics</text><text x="64" y="281" font-size="20">Security / cost / human checks</text><rect x="422" y="150" width="354" height="180" rx="14" fill="#ffffff" stroke="#7caaa0" stroke-width="2"/><text x="442" y="188" font-size="30" font-weight="700">DIVERSITY AT WORK</text><text x="442" y="223" font-size="20">Whose skills are represented?</text><text x="442" y="252" font-size="20">A historical proxy can exclude</text><text x="442" y="281" font-size="21">Efficiency requires scrutiny</text><rect x="799" y="150" width="355" height="180" rx="14" fill="#ffffff" stroke="#7caaa0" stroke-width="2"/><text x="819" y="188" font-size="30" font-weight="700">DIVERSIFICATION</text><text x="819" y="223" font-size="24">Horizontal: complementary</text><text x="819" y="252" font-size="21">Vertical: supply-chain stage</text><text x="819" y="281" font-size="23">Concentric: wider audience</text><rect x="44" y="365" width="1110" height="190" rx="14" fill="#ffffff" stroke="#7caaa0" stroke-width="2"/><text x="64" y="403" font-size="30" font-weight="700">A fourth strategy: conglomerate diversification</text><text x="64" y="438" font-size="26">A business enters an unrelated market. This differs from workforce diversity.</text><text x="64" y="467" font-size="26">Example for classification: a search business investing in vehicle technology.</text><text x="64" y="496" font-size="28">Prompt: where would a platform adding a creator shop fit — and why?</text><text x="44" y="643" font-size="17">Original teaching schematic · Digital business includes transactions, inventory, communication and analytics</text></g></svg>