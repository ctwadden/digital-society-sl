<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">Three dilemmas. Three different questions.</title><desc id="desc">Bias concerns systematic skew, opacity concerns understanding a decision, and accountability concerns explanation, correction and responsibility. Each requires different evidence and action.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#176d66"/></marker></defs><rect width="1200" height="680" rx="20" fill="#f0f6f2"/><g font-family="Arial,sans-serif" fill="#15313c"><text x="44" y="66" font-size="38" font-weight="700">Three dilemmas. Three different questions.</text><text x="44" y="104" font-size="21">3.2E · pp. 86–89 · a visible rule can still create biased outcomes.</text><rect x="44" y="160" width="355" height="335" rx="14" fill="#ffffff" stroke="#7caaa0" stroke-width="2"/><text x="64" y="198" font-size="30" font-weight="700">BIAS</text><text x="64" y="233" font-size="20">Who is systematically skewed?</text><text x="64" y="262" font-size="21">Historical / incomplete data</text><text x="64" y="291" font-size="25">A proxy can miss a skill</text><text x="64" y="320" font-size="22">Test outcomes across groups</text><rect x="422" y="160" width="355" height="335" rx="14" fill="#ffffff" stroke="#7caaa0" stroke-width="2"/><text x="442" y="198" font-size="30" font-weight="700">OPACITY</text><text x="442" y="233" font-size="20">Can a decision be understood?</text><text x="442" y="262" font-size="20">Which inputs or rules matter?</text><text x="442" y="291" font-size="21">Explanation can be difficult</text><text x="442" y="320" font-size="20">Transparency permits scrutiny</text><rect x="799" y="160" width="355" height="335" rx="14" fill="#ffffff" stroke="#7caaa0" stroke-width="2"/><text x="819" y="198" font-size="30" font-weight="700">ACCOUNTABILITY</text><text x="819" y="233" font-size="21">Who must respond and repair?</text><text x="819" y="262" font-size="22">Who can contest a decision?</text><text x="819" y="291" font-size="21">Who owns the responsibility?</text><text x="819" y="320" font-size="22">A remedy needs human agency</text><text x="44" y="643" font-size="17">Original teaching schematic · Bias concerns systematic skew, opacity concerns understanding a decision, and accountability concerns exp</text></g></svg>