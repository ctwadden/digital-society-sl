<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">From signals to a feed</title><desc id="desc">Interactions, video information and account settings enter ranking and filtering. An ordered feed appears. Human objectives and controls shape it; the provider description does not disclose current weights.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#176d66"/></marker></defs><rect width="1200" height="680" rx="20" fill="#f0f6f2"/><g font-family="Arial,sans-serif" fill="#15313c"><text x="44" y="66" font-size="38" font-weight="700">From signals to a feed</text><text x="44" y="104" font-size="21">TikTok states these categories in June 2020; current weights are undisclosed.</text><rect x="44" y="160" width="330" height="285" rx="14" fill="#ffffff" stroke="#7caaa0" stroke-width="2"/><text x="64" y="198" font-size="30" font-weight="700">INPUTS</text><text x="64" y="233" font-size="18">Interactions: watching, liking</text><text x="64" y="262" font-size="19">Video: captions, sounds, tags</text><text x="64" y="291" font-size="23">Account/device: language</text><text x="64" y="320" font-size="21">Completion is not a motive</text><path d="M382,285 L431,285" fill="none" stroke="#176d66" stroke-width="4" marker-end="url(#arrow)"/><rect x="445" y="160" width="325" height="285" rx="14" fill="#ffffff" stroke="#7caaa0" stroke-width="2"/><text x="465" y="198" font-size="30" font-weight="700">PROCESS</text><text x="465" y="233" font-size="21">Predict possible interest</text><text x="465" y="262" font-size="21">Weight and rank candidates</text><text x="465" y="291" font-size="18">Apply eligibility/safety rules</text><text x="465" y="320" font-size="21">Diversify recommendations</text><path d="M780,285 L825,285" fill="none" stroke="#176d66" stroke-width="4" marker-end="url(#arrow)"/><rect x="842" y="160" width="310" height="285" rx="14" fill="#ffffff" stroke="#7caaa0" stroke-width="2"/><text x="862" y="198" font-size="30" font-weight="700">OUTPUT</text><text x="862" y="233" font-size="22">Ordered recommendations</text><text x="862" y="262" font-size="21">Some items remain unseen</text><text x="862" y="291" font-size="27">People choose goals</text><text x="862" y="320" font-size="19">People can contest results</text><text x="44" y="643" font-size="17">Original teaching schematic · Interactions, video information and account settings enter ranking and filtering</text></g></svg>