<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">Big data: four different questions</title><desc id="desc">Volume is amount; velocity is generation and processing speed; variety is formats and sources; veracity is quality. The 20 and 200 row examples are synthetic.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#176d66"/></marker></defs><rect width="1200" height="680" rx="20" fill="#f0f6f2"/><g font-family="Arial,sans-serif" fill="#15313c"><text x="44" y="66" font-size="38" font-weight="700">Big data: four different questions</text><text x="44" y="104" font-size="21">3.1H · pp. 72–74 · more rows cannot repair a missing population.</text><rect x="44" y="145" width="540" height="205" rx="14" fill="#ffffff" stroke="#7caaa0" stroke-width="2"/><text x="64" y="183" font-size="30" font-weight="700">VOLUME</text><text x="64" y="218" font-size="28">How much data?</text><text x="64" y="247" font-size="27">20 complete rows / 200 partial rows</text><rect x="611" y="145" width="540" height="205" rx="14" fill="#ffffff" stroke="#7caaa0" stroke-width="2"/><text x="631" y="183" font-size="30" font-weight="700">VELOCITY</text><text x="631" y="218" font-size="28">How quickly is data generated?</text><text x="631" y="247" font-size="25">One weekly batch / events each second</text><rect x="44" y="379" width="540" height="205" rx="14" fill="#ffffff" stroke="#7caaa0" stroke-width="2"/><text x="64" y="417" font-size="30" font-weight="700">VARIETY</text><text x="64" y="452" font-size="28">Which formats and sources?</text><text x="64" y="481" font-size="28">Tables, video, text, device events</text><rect x="611" y="379" width="540" height="205" rx="14" fill="#ffffff" stroke="#7caaa0" stroke-width="2"/><text x="631" y="417" font-size="30" font-weight="700">VERACITY</text><text x="631" y="452" font-size="28">How accurate and representative?</text><text x="631" y="481" font-size="26">Duplicates? Unknowns? Unseen people?</text><text x="44" y="643" font-size="17">Original teaching schematic · Volume is amount; velocity is generation and processing speed; variety is formats and sources; veracity i</text></g></svg>