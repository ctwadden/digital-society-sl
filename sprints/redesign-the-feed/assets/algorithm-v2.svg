<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">An algorithm has more than a score</title><desc id="desc">Museum input records pass a validity condition, a finite record-processing loop and a sort with a tie-break. Missing data must have a declared policy.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#176d66"/></marker></defs><rect width="1200" height="680" rx="20" fill="#f0f6f2"/><g font-family="Arial,sans-serif" fill="#15313c"><text x="44" y="66" font-size="38" font-weight="700">An algorithm has more than a score</text><text x="44" y="104" font-size="21">Parallel museum example · synthetic · retrieve textbook pp. 81–85</text><rect x="44" y="170" width="240" height="235" rx="14" fill="#ffffff" stroke="#7caaa0" stroke-width="2"/><text x="64" y="208" font-size="30" font-weight="700">1 INPUT</text><text x="64" y="243" font-size="25">Exhibit records</text><text x="64" y="272" font-size="16">Missing visits = unknown</text><text x="64" y="301" font-size="21">State a rule first</text><path d="M291,285 L325,285" fill="none" stroke="#176d66" stroke-width="4" marker-end="url(#arrow)"/><rect x="338" y="170" width="240" height="235" rx="14" fill="#ffffff" stroke="#7caaa0" stroke-width="2"/><text x="358" y="208" font-size="30" font-weight="700">2 CONDITION</text><text x="358" y="243" font-size="19">Is the record valid?</text><text x="358" y="272" font-size="17">If not: flag / exclude</text><text x="358" y="301" font-size="19">Never invent a visit</text><path d="M585,285 L623,285" fill="none" stroke="#176d66" stroke-width="4" marker-end="url(#arrow)"/><rect x="635" y="170" width="240" height="235" rx="14" fill="#ffffff" stroke="#7caaa0" stroke-width="2"/><text x="655" y="208" font-size="30" font-weight="700">3 LOOP</text><text x="655" y="243" font-size="20">Process each record</text><text x="655" y="272" font-size="22">Compute one score</text><text x="655" y="301" font-size="19">Stop at final record</text><path d="M884,285 L921,285" fill="none" stroke="#176d66" stroke-width="4" marker-end="url(#arrow)"/><rect x="934" y="170" width="223" height="235" rx="14" fill="#ffffff" stroke="#7caaa0" stroke-width="2"/><text x="954" y="208" font-size="30" font-weight="700">4 OUTPUT</text><text x="954" y="243" font-size="20">Sort valid scores</text><text x="954" y="272" font-size="23">Use a tie-break</text><text x="954" y="301" font-size="18">Keep an audit trail</text><rect x="44" y="460" width="1113" height="112" rx="14" fill="#ffffff" stroke="#7caaa0" stroke-width="2"/><text x="64" y="498" font-size="30" font-weight="700">Read the trace</text><text x="64" y="533" font-size="27">Changing the missing-data rule changes which records can reach the ranking.</text><text x="44" y="643" font-size="17">Original teaching schematic · Museum input records pass a validity condition, a finite record-processing loop and a sort with a tie-bre</text></g></svg>