<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">A feed helps create its next inputs</title><desc id="desc">Exposure permits interaction; interaction becomes logged data; the ranking rule uses it for the next exposure. Unseen content lacks an equivalent opportunity. A discovery slot changes exposure.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#176d66"/></marker></defs><rect width="1200" height="680" rx="20" fill="#f0f6f2"/><g font-family="Arial,sans-serif" fill="#15313c"><text x="44" y="66" font-size="38" font-weight="700">A feed helps create its next inputs</text><text x="44" y="104" font-size="21">Not every user or creator has an equal chance to be observed.</text><rect x="110" y="155" width="400" height="135" rx="14" fill="#ffffff" stroke="#7caaa0" stroke-width="2"/><text x="130" y="193" font-size="30" font-weight="700">1 EXPOSURE</text><text x="130" y="228" font-size="26">Which items are displayed?</text><path d="M530,220 L653,220" fill="none" stroke="#176d66" stroke-width="4" marker-end="url(#arrow)"/><rect x="680" y="155" width="400" height="135" rx="14" fill="#ffffff" stroke="#7caaa0" stroke-width="2"/><text x="700" y="193" font-size="30" font-weight="700">2 INTERACTION</text><text x="700" y="228" font-size="20">Watch, skip, like — after exposure</text><path d="M880,308 L880,386" fill="none" stroke="#176d66" stroke-width="4" marker-end="url(#arrow)"/><rect x="680" y="414" width="400" height="135" rx="14" fill="#ffffff" stroke="#7caaa0" stroke-width="2"/><text x="700" y="452" font-size="30" font-weight="700">3 LOGGED DATA</text><text x="700" y="487" font-size="22">Unseen items have no trial here</text><path d="M653,480 L528,480" fill="none" stroke="#176d66" stroke-width="4" marker-end="url(#arrow)"/><rect x="110" y="414" width="400" height="135" rx="14" fill="#ffffff" stroke="#7caaa0" stroke-width="2"/><text x="130" y="452" font-size="30" font-weight="700">4 NEXT RANKING</text><text x="130" y="487" font-size="23">Apply the rule to updated data</text><path d="M310,397 L310,309" fill="none" stroke="#176d66" stroke-width="4" marker-end="url(#arrow)"/><rect x="408" y="314" width="388" height="69" rx="14" fill="#d3e9df" stroke="#7caaa0" stroke-width="2"/><text x="428" y="352" font-size="30" font-weight="700">Control point</text><text x="428" y="387" font-size="28"></text><text x="44" y="643" font-size="17">Original teaching schematic · Exposure permits interaction; interaction becomes logged data; the ranking rule uses it for the next expo</text></g></svg>