<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">Compare sources on a shared theme</title><desc id="desc">TikTok 2020 states how its recommendations work. The European Commission February 2026 reports a preliminary finding on addictive design, considering multiple features. Compare personalization and risk without treating dates or purposes as direct contradiction.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#176d66"/></marker></defs><rect width="1200" height="680" rx="20" fill="#f0f6f2"/><g font-family="Arial,sans-serif" fill="#15313c"><text x="44" y="66" font-size="38" font-weight="700">Compare sources on a shared theme</text><text x="44" y="104" font-size="21">Theme: personalization and risk · different dates, purposes and evidence.</text><rect x="44" y="160" width="520" height="345" rx="14" fill="#ffffff" stroke="#7caaa0" stroke-width="2"/><text x="64" y="198" font-size="30" font-weight="700">A · TIKTOK · 18 JUNE 2020</text><text x="64" y="233" font-size="28">Provider explanation</text><text x="64" y="262" font-size="27">How recommendations are described</text><text x="64" y="291" font-size="26">Useful for stated signals and goals</text><text x="64" y="320" font-size="24">Does not reveal current exact weights</text><text x="64" y="349" font-size="28">Does not independently test harm</text><rect x="600" y="160" width="552" height="345" rx="14" fill="#ffffff" stroke="#7caaa0" stroke-width="2"/><text x="620" y="198" font-size="30" font-weight="700">C · EU COMMISSION · 6 FEB 2026</text><text x="620" y="233" font-size="28">Preliminary regulatory finding</text><text x="620" y="262" font-size="26">Personalization is one design feature</text><text x="620" y="291" font-size="28">Research, documents and interviews</text><text x="620" y="320" font-size="26">Useful for a substantiated risk claim</text><text x="620" y="349" font-size="25">Not a final decision or isolated effect</text><text x="44" y="643" font-size="17">Original teaching schematic · TikTok 2020 states how its recommendations work</text></g></svg>