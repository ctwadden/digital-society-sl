<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">Two percentages. Two different bases.</title><desc id="desc">Watch page ads pay 55 percent of net ad revenue; Shorts pay 45 percent of the allocated Creator Pool share. The 100-unit examples are synthetic and cannot predict a creator income.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#176d66"/></marker></defs><rect width="1200" height="680" rx="20" fill="#f0f6f2"/><g font-family="Arial,sans-serif" fill="#15313c"><text x="44" y="66" font-size="38" font-weight="700">Two percentages. Two different bases.</text><text x="44" y="104" font-size="21">YouTube Help · policy checked 4 October 2026 · no earnings guarantee.</text><rect x="44" y="155" width="540" height="380" rx="14" fill="#ffffff" stroke="#7caaa0" stroke-width="2"/><text x="64" y="193" font-size="30" font-weight="700">WATCH PAGE ADS</text><text x="64" y="228" font-size="28">55% of net ad revenue</text><text x="64" y="257" font-size="28">100 eligible net units × .55 = 55</text><text x="64" y="286" font-size="28">Net revenue is the base</text><text x="64" y="315" font-size="23">Synthetic units: not an earnings forecast</text><rect x="611" y="155" width="540" height="380" rx="14" fill="#ffffff" stroke="#7caaa0" stroke-width="2"/><text x="631" y="193" font-size="30" font-weight="700">SHORTS FEED ADS</text><text x="631" y="228" font-size="27">45% of allocated Creator Pool share</text><text x="631" y="257" font-size="28">100 allocated units × .45 = 45</text><text x="631" y="286" font-size="27">Allocation happens before this step</text><text x="631" y="315" font-size="28">The bases are not interchangeable</text><text x="44" y="643" font-size="17">Original teaching schematic · Watch page ads pay 55 percent of net ad revenue; Shorts pay 45 percent of the allocated Creator Pool shar</text></g></svg>