<svg xmlns="http://www.w3.org/2000/svg" width="960" height="380" viewBox="0 0 960 380" role="img" aria-label="Path of one feed request: phone, access network, internet service provider, internet routing, DNS lookup, data centre with ranking service, item store and interaction log; video files from a nearby cache."><title>Path of one feed request: phone, access network, internet service provider, internet routing, DNS lookup, data centre with ranking service, item store and interaction log; video files from a nearby cache.</title><rect width="960" height="380" fill="#eef3ed"/><style>text{font-family:Arial,sans-serif;fill:#163443}.l{font-size:20px;font-weight:700}.t{font-size:17px}.s{font-size:14px}.box{fill:#fffcf5;stroke:#397570;stroke-width:2}.warn{fill:#f6ebd5;stroke:#b55416;stroke-width:2}.a{stroke:#397570;stroke-width:3;fill:none;marker-end:url(#h)}.d{stroke:#b55416;stroke-width:3;fill:none;stroke-dasharray:8 6;marker-end:url(#h2)}</style><defs><marker id="h" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#397570"/></marker><marker id="h2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#b55416"/></marker></defs><text class="l" x="24" y="34">Where the data moves for one recommendation</text><rect class="box" x="20" y="70" width="150" height="80" rx="8"/><text class="l" x="32" y="98">PHONE</text><text class="t" x="32" y="122">app requests feed</text><rect class="box" x="200" y="70" width="160" height="80" rx="8"/><text class="l" x="212" y="98">ACCESS</text><text class="t" x="212" y="122">Wi-Fi / mobile</text><rect class="box" x="390" y="70" width="150" height="80" rx="8"/><text class="l" x="402" y="98">ISP</text><text class="t" x="402" y="122">provider network</text><rect class="box" x="570" y="70" width="170" height="80" rx="8"/><text class="l" x="582" y="98">INTERNET</text><text class="t" x="582" y="122">routing (BGP)</text><rect class="box" x="770" y="60" width="170" height="100" rx="8"/><text class="l" x="782" y="88">DNS</text><text class="t" x="782" y="112">finds the service</text><text class="t" x="782" y="133">address</text><rect class="box" x="560" y="210" width="380" height="130" rx="8"/><text class="l" x="572" y="238">DATA CENTRE</text><text class="t" x="572" y="262">ranking service</text><text class="t" x="572" y="283">item store · interaction log</text><text class="t" x="572" y="304">returns ranked list</text><rect class="box" x="20" y="230" width="260" height="90" rx="8"/><text class="l" x="32" y="258">CACHE / CDN</text><text class="t" x="32" y="282">video files from a</text><text class="t" x="32" y="303">nearby server</text><path class="a" d="M170 110H192"/><path class="a" d="M360 110H382"/><path class="a" d="M540 110H562"/><path class="a" d="M740 110H762"/><path class="a" d="M655 150V202"/><path class="a" d="M560 290H288"/><path class="a" d="M95 222V158"/><text class="s" x="24" y="366">Mark three dependency points: request, interaction logging, ranking reads data. What fails at each?</text></svg>