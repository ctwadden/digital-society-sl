<svg xmlns="http://www.w3.org/2000/svg" width="960" height="380" viewBox="0 0 960 380" role="img" aria-label="Synthetic Loopline labour chain: advertisers pay Loopline; Loopline shares revenue with creators and contracts a vendor; the vendor employs reviewers and data labellers in other countries; labels flow back to Loopline."><title>Synthetic Loopline labour chain: advertisers pay Loopline; Loopline shares revenue with creators and contracts a vendor; the vendor employs reviewers and data labellers in other countries; labels flow back to Loopline.</title><rect width="960" height="380" fill="#eef3ed"/><style>text{font-family:Arial,sans-serif;fill:#163443}.l{font-size:20px;font-weight:700}.t{font-size:17px}.s{font-size:14px}.box{fill:#fffcf5;stroke:#397570;stroke-width:2}.warn{fill:#f6ebd5;stroke:#b55416;stroke-width:2}.a{stroke:#397570;stroke-width:3;fill:none;marker-end:url(#h)}.d{stroke:#b55416;stroke-width:3;fill:none;stroke-dasharray:8 6;marker-end:url(#h2)}</style><defs><marker id="h" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#397570"/></marker><marker id="h2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#b55416"/></marker></defs><text class="l" x="24" y="34">Loopline labour chain · invented example (arrows: solid = money, dashed = data)</text><rect class="box" x="30" y="70" width="190" height="80" rx="8"/><text class="l" x="42" y="98">ADVERTISERS</text><text class="t" x="42" y="122">pay for attention</text><rect class="box" x="380" y="70" width="200" height="80" rx="8"/><text class="l" x="392" y="98">LOOPLINE HQ</text><text class="t" x="392" y="122">Canada (fictional)</text><rect class="box" x="730" y="70" width="200" height="80" rx="8"/><text class="l" x="742" y="98">CREATORS</text><text class="t" x="742" y="122">many countries</text><rect class="box" x="380" y="230" width="200" height="90" rx="8"/><text class="l" x="392" y="258">VENDOR</text><text class="t" x="392" y="282">contracted company</text><rect class="box" x="700" y="220" width="240" height="110" rx="8"/><text class="l" x="712" y="248">REVIEWERS</text><text class="t" x="712" y="272">moderation &amp; labelling</text><text class="t" x="712" y="293">in other countries</text><text class="t" x="712" y="314">paid per task</text><path class="a" d="M220 110H372"/><path class="a" d="M580 100H722"/><path class="a" d="M480 150V222"/><path class="a" d="M580 275H692"/><path class="d" d="M730 132H588"/><path class="d" d="M700 300H588"/><path class="d" d="M430 222V158"/><text class="s" x="24" y="366">Invented chain. Link it to the ILO 2021 findings, and keep the real report separate from the example.</text></svg>