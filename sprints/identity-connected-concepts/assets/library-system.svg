<svg xmlns="http://www.w3.org/2000/svg" width="960" height="340" viewBox="0 0 960 340" role="img" aria-label="Fictional library: a QR scan checks records, applies a council rule, returns a decision; staff can repair records and a manager controls exceptions"><rect width="960" height="340" fill="#eef3ed"/><style>text{font-family:Arial,sans-serif;fill:#163443}.label{font-size:21px;font-weight:700}.text{font-size:18px}.line{stroke:#397570;stroke-width:3;fill:none;marker-end:url(#arrow)}</style><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#397570"/></marker></defs><title>Fictional library: a QR scan checks records, applies a council rule, returns a decision; staff can repair records and a manager controls exceptions</title><text x="28" y="37" class="label">Library tablet loan • synthetic teaching model</text><path d="M172 119H222M435 119H486M678 119H732" class="line"/><text x="27" y="95" class="label">INPUT</text><text x="27" y="128" class="text">QR member ID</text><text x="241" y="95" class="label">PROCESS</text><text x="241" y="128" class="text">Check loan record</text><text x="241" y="155" class="text">Apply council rule</text><text x="505" y="95" class="label">OUTPUT</text><text x="505" y="128" class="text">Eligible / blocked</text><text x="751" y="95" class="label">ACTION</text><text x="751" y="128" class="text">Staff issue tablet</text><text x="751" y="155" class="text">or explain refusal</text><path d="M830 181V233H337V174" class="line"/><text x="398" y="219" class="text">Staff correct inaccurate records</text><text x="28" y="295" class="text">Council owns the rule. Manager controls exceptions. Members can request a correction.</text></svg>