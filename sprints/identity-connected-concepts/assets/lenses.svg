<svg xmlns="http://www.w3.org/2000/svg" width="960" height="340" viewBox="0 0 960 340" role="img" aria-label="Power, systems and values connect through a specific decision"><rect width="960" height="340" fill="#eef3ed"/><style>text{font-family:Arial,sans-serif;fill:#163443}.label{font-size:21px;font-weight:700}.text{font-size:18px}.line{stroke:#397570;stroke-width:3;fill:none;marker-end:url(#arrow)}</style><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#397570"/></marker></defs><title>Power, systems and values connect through a specific decision</title><text x="35" y="40" class="label">The same decision, examined through three lenses</text><path d="M250 115H358M610 115H695M835 148V239H470V150" class="line"/><text x="40" y="92" class="label">POWER</text><text x="40" y="121" class="text">Who sets the rule?</text><text x="385" y="92" class="label">SYSTEMS</text><text x="385" y="121" class="text">How does it act?</text><text x="710" y="92" class="label">VALUES &amp; ETHICS</text><text x="710" y="121" class="text">Who bears the cost?</text><text x="500" y="224" class="text">A challenge can change the rule</text><text x="35" y="292" class="text">IDENTITY: What does this decision change about how a person is represented or treated?</text></svg>